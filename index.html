{<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desafío: el sistema nervioso</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--card:#F4F3FB;--tx:#26215C;--mut:#5F5E5A;--ac:#534AB7;--ok:#1D9E75;--okbg:#E1F5EE;--no:#D85A30;--nobg:#FAECE7;--bd:#CECBF6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a22;--card:#26243a;--tx:#EEEDFE;--mut:#B4B2A9;--ac:#AFA9EC;--ok:#5DCAA5;--okbg:#0b3a2d;--no:#F0997B;--nobg:#4a1f10;--bd:#3C3489}}
:root[data-theme="dark"]{--bg:#1b1a22;--card:#26243a;--tx:#EEEDFE;--mut:#B4B2A9;--ac:#AFA9EC;--ok:#5DCAA5;--okbg:#0b3a2d;--no:#F0997B;--nobg:#4a1f10;--bd:#3C3489}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:20px 16px 32px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.bar{height:8px;background:var(--card);border-radius:8px;overflow:hidden;margin-bottom:6px}
.bar div{height:100%;background:var(--ac);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:14px}
.q{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:15px;line-height:1.4;background:var(--card)}
.btn{font:inherit;font-weight:600;background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:13px 20px;cursor:pointer;width:100%}
.big{font-size:56px;font-weight:700;text-align:center;margin:10px 0 0;color:var(--ac)}
.c{text-align:center}
.hide{display:none}
</style></head>
<body><main>
<h1>🧠 El sistema nervioso</h1>
<p class="sub">Desafío de 10 preguntas: ¡tenés 20 segundos por pregunta!</p>
<div id="game">
 <div class="bar"><div id="pb"></div></div>
 <div class="meta"><span id="num"></span><span id="tm"></span><span id="sc"></span></div>
 <p class="q" id="q"></p>
 <div id="opts"></div>
 <div class="fb hide" id="fb"></div>
 <button class="btn hide" id="next">Siguiente</button>
</div>
<div id="end" class="hide">
 <p class="c sub">Tu puntaje final</p>
 <p class="big" id="final"></p>
 <p class="c" id="msg" style="font-size:17px;margin:10px 0 22px"></p>
 <button class="btn" id="again">Jugar de nuevo</button>
</div>
</main>
<script>
var Q=[
{q:"¿Cómo se llaman las células principales del sistema nervioso?",o:["Neuronas","Glóbulos rojos","Células óseas","Células musculares"],a:0,e:"Las neuronas son las células principales del sistema nervioso."},
{q:"¿Qué parte de la neurona recibe las señales de otras neuronas?",o:["Axón","Dendritas","Mielina","Núcleo"],a:1,e:"Las dendritas son prolongaciones ramificadas que reciben información."},
{q:"¿Qué parte de la neurona conduce el impulso nervioso hacia otras células?",o:["Axón","Dendritas","Soma","Hendidura"],a:0,e:"El axón es la prolongación larga que conduce el impulso."},
{q:"¿Dónde está el núcleo de la neurona?",o:["En el axón","En las dendritas","En el soma o cuerpo celular","En la mielina"],a:2,e:"El núcleo se encuentra en el soma o cuerpo celular."},
{q:"¿Qué función tiene la vaina de mielina?",o:["Hace más rápido el impulso","Produce neurotransmisores","Guarda la memoria","Recibe estímulos"],a:0,e:"La mielina aísla el axón y hace que el impulso viaje más rápido."},
{q:"¿Cómo se llama la unión entre dos neuronas?",o:["Músculo","Sinapsis","Meninge","Nervio craneal"],a:1,e:"La sinapsis es el punto donde una neurona transmite el impulso a la siguiente."},
{q:"¿Qué sustancias liberan las neuronas para comunicarse en la sinapsis química?",o:["Neurotransmisores","Hormonas del hueso","Mielina","Sangre"],a:0,e:"Los neurotransmisores, como la dopamina o la serotonina, llevan el mensaje a la neurona vecina."},
{q:"¿Qué dos partes forman el sistema nervioso central (SNC)?",o:["Corazón y pulmones","Encéfalo y médula espinal","Estómago e intestino","Ojos y oídos"],a:1,e:"El SNC está formado por el encéfalo y la médula espinal."},
{q:"¿Qué parte del encéfalo se asocia con la visión?",o:["Lóbulo occipital","Cerebelo","Bulbo raquídeo","Meninges"],a:0,e:"El lóbulo occipital procesa los estímulos visuales."},
{q:"¿Qué capas protegen al encéfalo y a la médula espinal?",o:["Las meninges","Las dendritas","Los músculos","Los neurotransmisores"],a:0,e:"Las meninges (duramadre, aracnoides y piamadre) protegen al sistema nervioso central."}
];
var T0=20,tl=T0,tm=null;
var i=0,s=0,done=false;
var $=function(id){return document.getElementById(id)};
function show(){
 done=false;var d=Q[i];
 $("num").textContent="Pregunta "+(i+1)+" de "+Q.length;
 $("sc").textContent="Puntos: "+s;
 $("pb").style.width=(i/Q.length*100)+"%";
 $("q").textContent=d.q;
 $("fb").className="fb hide";$("next").className="btn hide";
 clearInterval(tm);tl=T0;$("tm").textContent="⏱ "+tl;tm=setInterval(function(){tl--;$("tm").textContent="⏱ "+tl;if(tl<=0){pick(-1)}},1000);
 var h=$("opts");h.innerHTML="";
 d.o.forEach(function(t,k){
  var b=document.createElement("button");b.className="opt";b.textContent=t;
  b.onclick=function(){pick(k)};h.appendChild(b);
 });
}
function pick(k){
 if(done)return;done=true;clearInterval(tm);var d=Q[i];
 var bs=$("opts").children;
 for(var j=0;j<bs.length;j++){bs[j].disabled=true;if(j===d.a)bs[j].classList.add("ok")}
 if(k===d.a){s++;}else if(k>=0){bs[k].classList.add("no")}
 $("sc").textContent="Puntos: "+s;
 $("fb").textContent=(k===d.a?"✅ ¡Correcto! ":k<0?"⏰ Se acabó el tiempo. ":"❌ Incorrecto. ")+d.e;
 $("fb").className="fb";
 $("next").textContent=i===Q.length-1?"Ver resultado":"Siguiente";
 $("next").className="btn";
}
$("next").onclick=function(){
 i++;
 if(i>=Q.length){
  $("game").className="hide";$("end").className="";
  $("final").textContent=s+" / "+Q.length;
  $("msg").textContent=s>=9?"¡Excelente! Dominás el tema 🏆":s>=6?"¡Muy bien! Repasá un poco más 👍":"Seguí estudiando, ¡vos podés! 📚";
 }else show();
};
$("again").onclick=function(){i=0;s=0;$("end").className="hide";$("game").className="";show()};
show();
</script></body></html>
